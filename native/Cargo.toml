[package]
name = "ya-core"
version = "0.7.2"
edition = "2021"
license = "MIT"
description = "Shared Rust core for the Ya CLI and desktop application"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
encoding_rs = "0.8.41"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
unicode-normalization = "0.1.25"
url = "2.5.8"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
