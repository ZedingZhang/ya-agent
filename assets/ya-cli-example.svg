<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#101418"/>
  <rect x="80" y="80" width="1440" height="740" rx="20" fill="#172027" stroke="#3a4752" stroke-width="2"/>
  <path d="M100 100h1400a20 20 0 0 1 20 20v62H80v-62a20 20 0 0 1 20-20Z" fill="#202a32"/>
  <circle cx="122" cy="141" r="12" fill="#ff5f56"/>
  <circle cx="160" cy="141" r="12" fill="#ffbd2e"/>
  <circle cx="198" cy="141" r="12" fill="#27c93f"/>
  <text x="242" y="149" fill="#9fb0bc" font-family="Menlo, Monaco, Consolas, 'PingFang SC', sans-serif" font-size="26">ya - zsh</text>
  <text x="130" y="255" fill="#63d1ac" font-family="Menlo, Monaco, Consolas, 'PingFang SC', sans-serif" font-size="25">$</text>
  <text x="165" y="255" fill="#f1f5f8" font-family="Menlo, Monaco, Consolas, 'PingFang SC', sans-serif" font-size="25">ya ask &quot;什么是 Graph Engineering？请用两句话解释。&quot; --no-feedback</text>
  <text x="130" y="390" fill="#8cc6ff" font-family="Menlo, Monaco, Consolas, 'PingFang SC', sans-serif" font-size="28" font-weight="700">[Ya single result]</text>
  <g fill="#d7e0e8" font-family="Menlo, Monaco, Consolas, 'PingFang SC', sans-serif" font-size="23">
    <text x="130" y="475">Graph Engineering（图工程）是指构建、维护和优化大规模图结构（如知识图谱、社交网络图或关系网络）的工程实践，</text>
    <text x="130" y="522">涵盖数据建模、存储、查询与推理等全流程。它旨在通过高效的图算法和系统架构，使机器能够更好地利用图数据中的</text>
    <text x="130" y="569">实体与关系信息，支撑搜索、推荐、AI 推理等上层应用。</text>
  </g>
  <text x="130" y="755" fill="#7f919f" font-family="Menlo, Monaco, Consolas, 'PingFang SC', sans-serif" font-size="21">Illustrative terminal-style rendering based on a real Ya CLI response</text>
</svg>
