  <text x="242" y="149" fill="#9fb0bc" font-family="Menlo, Monaco, Consolas, monospace" font-size="26">ya - zsh</text>
  <text x="130" y="255" fill="#63d1ac" font-family="Menlo, Monaco, Consolas, monospace" font-size="25">$</text>
  <text x="165" y="255" fill="#f1f5f8" font-family="Menlo, Monaco, Consolas, monospace" font-size="25">ya ask &quot;Explain Graph Engineering in two sentences.&quot; --no-feedback</text>
  <text x="130" y="390" fill="#8cc6ff" font-family="Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700">[Ya single result]</text>
  <g fill="#d7e0e8" font-family="Menlo, Monaco, Consolas, monospace" font-size="23">
    <text x="130" y="475">Graph Engineering is the practice of building and operating systems that model</text>
    <text x="130" y="522">entities and relationships as graphs. It combines data modeling, storage,</text>
    <text x="130" y="569">querying, and graph algorithms for applications such as search and recommendation.</text>
  </g>
  <text x="130" y="755" fill="#7f919f" font-family="Menlo, Monaco, Consolas, monospace" font-size="21">Illustrative terminal-style rendering based on a real Ya CLI response</text>
