name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS ARM64
            cli_asset: ya-macos-arm64
            gui_asset: ya-gui-macos-arm64.zip
          - os: macos-15-intel
            platform: macOS x64
            cli_asset: ya-macos-x64
            gui_asset: ya-gui-macos-x64.zip
          - os: windows-2022
            platform: Windows x64
            cli_asset: ya-windows-x64.exe
            gui_asset: ya-gui-windows-x64.exe
          - os: ubuntu-22.04
            platform: Linux x64
            cli_asset: ya-linux-x64
            gui_asset: ya-gui-linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import re

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          project = re.search(r'^version = "([^"]+)"$', Path("pyproject.toml").read_text(), re.MULTILINE)
          module = ast.parse(Path("ya/__init__.py").read_text())
          version = next((node.value.value for node in module.body if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str)), None)
          if not project or project.group(1) != expected or version != expected:
              raise SystemExit("Release tag, project version, and ya.__version__ must match.")
          PY

      - name: Verify Tkinter is available
        run: python -c "import tkinter; print(tkinter.TkVersion)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Install PyInstaller
        run: python -m pip install PyInstaller==6.21.0

      - name: Build CLI executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name ya ya/__main__.py

      - name: Build GUI application on macOS
        if: runner.os == 'macOS'
        run: python -m PyInstaller --clean --noconfirm --windowed --name Ya ya/__gui__.py

      - name: Build GUI executable on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name ya-gui ya/__gui__.py

      - name: Smoke test frozen apps on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export YA_HOME="$RUNNER_TEMP/ya-home"
          ./dist/ya --help
          ./dist/ya config set thinking off
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/Ya.app/Contents/MacOS/Ya --smoke-test
          else
            ./dist/ya-gui --smoke-test
          fi

      - name: Smoke test frozen apps on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:YA_HOME = Join-Path $env:RUNNER_TEMP "ya-home"
          & .\dist\ya.exe --help
          & .\dist\ya.exe config set thinking off
          & .\dist\ya-gui.exe --smoke-test

      - name: Stage release assets
        shell: bash
        env:
          CLI_ASSET: ${{ matrix.cli_asset }}
          GUI_ASSET: ${{ matrix.gui_asset }}
        run: |
          mkdir release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/ya.exe "release/$CLI_ASSET"
            cp dist/ya-gui.exe "release/$GUI_ASSET"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp dist/ya "release/$CLI_ASSET"
            ditto -c -k --sequesterRsrc --keepParent dist/Ya.app "release/$GUI_ASSET"
          else
            cp dist/ya "release/$CLI_ASSET"
            cp dist/ya-gui "release/$GUI_ASSET"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.cli_asset }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build-binaries
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download standalone apps
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Build Python packages
        run: |
          python -m pip install build
          python -m build --outdir release

      - name: Generate checksums
        working-directory: release
        run: sha256sum ya-* > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --title "Ya $RELEASE_TAG" \
            --notes-file .github/release-notes.md
