name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS ARM64
            pkg_target: node22-macos-arm64
            electron_args: --mac zip --arm64
            cli_asset: ya-macos-arm64
            gui_asset: ya-gui-macos-arm64.zip
            gui_kind: mac
          - os: macos-15-intel
            platform: macOS x64
            pkg_target: node22-macos-x64
            electron_args: --mac zip --x64
            cli_asset: ya-macos-x64
            gui_asset: ya-gui-macos-x64.zip
            gui_kind: mac
          - os: windows-2022
            platform: Windows x64
            pkg_target: node22-win-x64
            electron_args: --win portable --x64
            cli_asset: ya-windows-x64.exe
            gui_asset: ya-gui-windows-x64.exe
            gui_kind: win
          - os: ubuntu-22.04
            platform: Linux x64
            pkg_target: node22-linux-x64
            electron_args: --linux AppImage --x64
            cli_asset: ya-linux-x64
            gui_asset: ya-gui-linux-x64
            gui_kind: linux

    steps:
      - uses: actions/checkout@v4

      - name: Require release signing credentials
        if: runner.os != 'Linux'
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          MAC_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
          WIN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            required=(MAC_CERTIFICATE MAC_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          else
            required=(WIN_CERTIFICATE WIN_PASSWORD)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing credential: $name. See docs/release-signing.md."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install dependencies
        run: npm ci

      - name: Build the native core
        run: npm run build:native

      - name: Check types, tests, and production build
        run: npm run check

      - name: Check behaviour parity against the Rust core
        run: npm run test:parity

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node dist/typescript/scripts/validate-version.js "$RELEASE_TAG"

      - name: Smoke test desktop application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:gui

      - name: Smoke test desktop application
        if: runner.os != 'Linux'
        run: npm run smoke:gui

      - name: Build CLI executable
        shell: bash
        env:
          PKG_TARGET: ${{ matrix.pkg_target }}
          CLI_ASSET: ${{ matrix.cli_asset }}
        run: npx pkg --compress GZip --targets "$PKG_TARGET" --output "release-cli/$CLI_ASSET" dist/typescript/cli.js

      - name: Build desktop application
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          ELECTRON_ARGS: ${{ matrix.electron_args }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx electron-builder $ELECTRON_ARGS --publish never
          else
            npx electron-builder $ELECTRON_ARGS --publish never --config.forceCodeSigning=true
          fi

      - name: Sign and notarize macOS CLI and verify desktop archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLI_ASSET: ${{ matrix.cli_asset }}
        run: bash .github/scripts/sign-macos.sh

      - name: Sign Windows CLI and verify desktop signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CLI_ASSET: ${{ matrix.cli_asset }}
        run: ./.github/scripts/sign-windows.ps1

      - name: Smoke test CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./release-cli/${{ matrix.cli_asset }} --help

      - name: Smoke test CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\release-cli\${{ matrix.cli_asset }}" --help'

      - name: Stage release assets
        shell: bash
        env:
          CLI_ASSET: ${{ matrix.cli_asset }}
          GUI_ASSET: ${{ matrix.gui_asset }}
          GUI_KIND: ${{ matrix.gui_kind }}
        run: |
          mkdir -p release-assets
          cp "release-cli/$CLI_ASSET" "release-assets/$CLI_ASSET"
          if [ "$GUI_KIND" = "mac" ]; then
            cp release/electron/*.zip "release-assets/$GUI_ASSET"
          elif [ "$GUI_KIND" = "win" ]; then
            cp release/electron/*.exe "release-assets/$GUI_ASSET"
          else
            cp release/electron/*.AppImage "release-assets/$GUI_ASSET"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.cli_asset }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build-binaries
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Download standalone apps
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Build npm package tarball
        run: npm pack --pack-destination release

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --title "Ya $RELEASE_TAG" \
            --notes-file .github/release-notes.md
